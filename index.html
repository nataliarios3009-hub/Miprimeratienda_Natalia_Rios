  <title>Mi tienda</title>
  <style>
    /* ==============================
       PALETA ERAS TOUR
       Cada color sale de una era; los textos usan
       tonos oscuros sobre fondos claros (y al revés)
       para que se lean bien.
    ================================ */

    :root {
      --fondo: #fdf3f9;          /* Lover: rosa muy suave */
      --tinta: #2a1a3a;          /* texto principal: ciruela oscuro */
      --tinta-suave: #5b4a6b;    /* texto secundario */
      --borde: #f0c4dc;          /* Lover: rosa */
      --medianoche: #14204a;     /* Midnights */
      --speaknow: #6b3fa0;       /* Speak Now */
      --red: #a4161f;            /* Red */
      --showgirl: #0b6e70;       /* Showgirl: verde azulado */
      --oro: #f2c75c;            /* Fearless */
    }

    body {
      font-family: 'Poppins', system-ui, Arial, sans-serif;
      background-color: var(--fondo);
      color: var(--tinta);
      padding: 20px;
      margin: 0;
      text-align: center;
    }

    /* ===== HEADER ===== */

    header.header {
      position: relative;
      padding: 44px 16px 26px;
      margin-bottom: 0;
      border-radius: 14px 14px 0 0;
      color: #fff;
      background: linear-gradient(100deg,
        #0f8b8d 0%, #e8b94a 12%, #8e5bb5 24%, #b3202a 36%,
        #8fd3f4 48%, #111 58%, #f7b6d2 70%, #9a9a94 80%,
        #a0623a 88%, #14204a 95%, #ff7a1a 100%);
    }

    /* capa oscura para que el texto blanco siempre se lea */
    header.header::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(20, 10, 30, 0.52);
    }

    header.header > * {
      position: relative;
      z-index: 1;
    }

    h1,
    header.header h1 {
      color: #fff !important;
      margin: 0 0 8px;
      font-family: 'Pinyon Script', cursive;
      font-weight: 400;
      font-size: clamp(2.6rem, 9vw, 5.2rem);
      line-height: 1.05;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
    }

    header.header h1 small {
      display: block;
      margin-top: 6px;
      font-family: 'Limelight', serif;
      font-size: 0.3em;
      letter-spacing: 0.12em;
      color: var(--oro) !important;
    }

    .slogan,
    header.header .slogan {
      color: #fff !important;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(1.15rem, 3vw, 1.6rem);
      margin: 12px 0 22px;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    }

    /* ===== BOTONES DE ERAS ===== */

    .eras {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 1100px;
      margin: 0 auto;
      padding: 6px 4px 14px;
    }

    .era {
      border: 2px solid transparent;
      border-radius: 999px;
      padding: 9px 18px;
      cursor: pointer;
      font-size: 1rem;
      white-space: nowrap;
      transition: transform 0.15s;
    }

    .era:hover,
    .era:focus-visible {
      transform: translateY(-3px) scale(1.05);
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .era.activa {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }

    .e-debut     { background: #2fa59b; color: #fff;    font-family: 'Playfair Display', serif; font-style: italic; }
    .e-fearless  { background: #e8b94a; color: #4a3300; font-family: 'Cinzel', serif; }
    .e-speaknow  { background: #7d4fa8; color: #fbe9ff; font-family: 'Pinyon Script', cursive; font-size: 1.25rem; }
    .e-red       { background: #a4161f; color: #f3e3d0; font-family: 'Playfair Display', serif; font-style: italic; }
    .e-1989      { background: #a9dcf3; color: #14405c; font-family: 'Poppins', sans-serif; font-weight: 600; }
    .e-rep       { background: #0d0d0d; color: #ddd;    font-family: 'UnifrakturCook', cursive; border-color: #444; }
    .e-lover     { background: linear-gradient(90deg, #f7b6d2, #a8d8f0); color: #5a2a4a; font-family: 'Pacifico', cursive; }
    .e-folklore  { background: #d9d6cf; color: #444;    font-family: 'Cormorant Garamond', serif; font-style: italic; }
    .e-evermore  { background: #a0623a; color: #fff0d9; font-family: 'Cormorant Garamond', serif; font-style: italic; }
    .e-midnights { background: #14204a; color: #c9d4ff; font-family: 'Josefin Sans', sans-serif; letter-spacing: 0.06em; }
    .e-ttpd      { background: #efe6d6; color: #2b2b2b; font-family: 'Special Elite', monospace; border-color: #2b2b2b; }
    .e-showgirl  { background: linear-gradient(90deg, #ff7a1a, #0f8b8d); color: #fff; font-family: 'Limelight', serif; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5); }

    /* ===== BENEFICIOS ===== */

    .beneficios {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      background-color: var(--medianoche);
      color: #fff;
      padding: 14px;
      margin-bottom: 30px;
      border-radius: 0 0 14px 14px;
    }

    .beneficios span {
      font-size: 14px;
    }

    /* ===== CATÁLOGO (cuadrícula 6 x 2) ===== */

    #productos {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 15px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Variables de cada era: fondo, texto, tipografía y botón */
    .producto {
      --bg: #fff;
      --fg: #2a1a3a;
      --btn-bg: #6b3fa0;
      --btn-fg: #fff;
      --titulo: 'Fraunces', serif;
      --cuerpo: 'Poppins', system-ui, sans-serif;

      background: var(--bg);
      color: var(--fg);
      font-family: var(--cuerpo);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      padding: 10px;
      width: auto;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 14px rgba(42, 26, 58, 0.18);
    }

    .producto[data-era="debut"] {
      --bg: #1f7f77; --fg: #ffffff; --btn-bg: #ffffff; --btn-fg: #1f7f77;
      --titulo: 'Playfair Display', serif;
    }
    .producto[data-era="fearless"] {
      --bg: #e8b94a; --fg: #3b2800; --btn-bg: #3b2800; --btn-fg: #f6dc9a;
      --titulo: 'Cinzel', serif;
    }
    .producto[data-era="speak-now"] {
      --bg: #6f3f9c; --fg: #fbe9ff; --btn-bg: #fbe9ff; --btn-fg: #4b2470;
      --titulo: 'Pinyon Script', cursive;
    }
    .producto[data-era="red"] {
      --bg: #a4161f; --fg: #fbeadb; --btn-bg: #fbeadb; --btn-fg: #7d0f17;
      --titulo: 'Playfair Display', serif;
    }
    .producto[data-era="1989"] {
      --bg: #a9dcf3; --fg: #12384f; --btn-bg: #12384f; --btn-fg: #e3f5ff;
      --titulo: 'Poppins', sans-serif;
    }
    .producto[data-era="reputation"] {
      --bg: #0d0d0d; --fg: #e9e9e9; --btn-bg: #e9e9e9; --btn-fg: #0d0d0d;
      --titulo: 'UnifrakturCook', cursive;
    }
    .producto[data-era="lover"] {
      --bg: linear-gradient(160deg, #f7b6d2, #a8d8f0); --fg: #4a1f3d; --btn-bg: #4a1f3d; --btn-fg: #ffeaf5;
      --titulo: 'Pacifico', cursive;
    }
    .producto[data-era="folklore"] {
      --bg: #d9d6cf; --fg: #34322e; --btn-bg: #34322e; --btn-fg: #f1efe9;
      --titulo: 'Cormorant Garamond', serif;
    }
    .producto[data-era="evermore"] {
      --bg: #8a4f2a; --fg: #fff0d9; --btn-bg: #fff0d9; --btn-fg: #5e3318;
      --titulo: 'Cormorant Garamond', serif;
    }
    .producto[data-era="midnights"] {
      --bg: #14204a; --fg: #dbe3ff; --btn-bg: #dbe3ff; --btn-fg: #14204a;
      --titulo: 'Josefin Sans', sans-serif;
    }
    .producto[data-era="ttpd"] {
      --bg: #efe6d6; --fg: #2b2b2b; --btn-bg: #2b2b2b; --btn-fg: #efe6d6;
      --titulo: 'Special Elite', monospace;
      --cuerpo: 'Special Elite', monospace;
      border: 2px solid #2b2b2b;
    }
    .producto[data-era="showgirl"] {
      --bg: linear-gradient(160deg, #d9570a, #0b6e70); --fg: #ffffff; --btn-bg: #ffffff; --btn-fg: #0b5557;
      --titulo: 'Limelight', serif;
    }

    /* El fondo puede ser color o degradé */
    .producto { background: var(--bg); }

    .producto img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 4px;
    }

    .sin-imagen {
      height: 140px;
      display: grid;
      place-items: center;
      font-size: 3.5rem;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 4px;
    }

    .producto h3 {
      margin: 12px 0 8px;
      color: var(--fg);
      font-family: var(--titulo);
      font-weight: 400;
      font-size: 1.15rem;
      line-height: 1.2;
    }

    /* Tipografías script: necesitan más tamaño para leerse */
    .producto[data-era="speak-now"] h3 { font-size: 1.6rem; }
    .producto[data-era="lover"] h3 { font-size: 1.05rem; }
    .producto[data-era="reputation"] h3 { font-size: 1.4rem; }

    .descripcion {
      font-size: 14px;
      color: var(--fg);
      min-height: 42px;
      flex-grow: 1;
    }

    .precio {
      font-size: 18px;
      font-weight: bold;
      color: var(--fg);
      margin: 8px 0;
    }

    /* ===== BOTONES ===== */

    .producto button {
      background-color: var(--btn-bg);
      color: var(--btn-fg);
      font-family: var(--cuerpo);
      font-weight: 600;
      border: none;
      padding: 9px 12px;
      margin-top: 5px;
      border-radius: 4px;
      cursor: pointer;
    }

    .producto button:hover {
      opacity: 0.85;
    }

    /* Cuadrícula adaptable: 6 → 4 → 3 → 2 → 1 columnas */
    @media (max-width: 1250px) { #productos { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (max-width: 900px)  { #productos { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 640px)  { #productos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 380px)  { #productos { grid-template-columns: 1fr; } }

    /* ===== CARRITO ===== */

    .carrito {
      margin-top: 35px;
      padding: 20px;
      background: #fff;
      border: 2px solid var(--borde);
      border-radius: 8px;
      text-align: left;
      display: inline-block;
      min-width: 320px;
      color: var(--tinta);
    }

    .carrito h2 {
      margin-top: 0;
      color: var(--medianoche);
      font-family: 'Fraunces', serif;
      font-style: italic;
    }

    #lista-carrito {
      padding-left: 20px;
    }

    #lista-carrito li {
      margin-bottom: 8px;
    }

    .resumen {
      border-top: 1px solid var(--borde);
      margin-top: 15px;
      padding-top: 10px;
    }

    .total {
      font-size: 19px;
    }

    /* Botón vaciar */

    .vaciar {
      background-color: var(--red);
      border: none;
      color: #fff;
      padding: 9px 12px;
      margin-top: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Botón finalizar */

    .finalizar {
      background-color: var(--showgirl);
      border: none;
      color: #fff;
      padding: 9px 12px;
      margin-top: 10px;
      margin-left: 5px;
      border-radius: 4px;
      cursor: pointer;
    }

    .vaciar:hover,
    .finalizar:hover {
      opacity: 0.85;
    }

    @media (prefers-reduced-motion: reduce) {
      .era { transition: none; }
    }
  </style>
</head>

      actualizarCarrito();

    }
